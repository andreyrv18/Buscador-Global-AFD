name: CI

on:
  push:
    branches: [main, react-rebuild]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Permissão nova desativa a extensão para quem já tem a 3.8 instalada, e o
      # <all_urls> que o CRXJS injeta para o HMR não pode ir para a loja.
      - name: Conferir o manifest gerado
        run: |
          node -e '
            const m = require("./dist/manifest.json");
            const permissoes = JSON.stringify(m.permissions);
            if (permissoes !== JSON.stringify(["notifications"])) throw new Error("permissões inesperadas: " + permissoes);
            if (JSON.stringify(m.web_accessible_resources ?? []).includes("<all_urls>")) throw new Error("web_accessible_resources com <all_urls>");
            console.log("manifest", m.version, "ok");
          '

      - name: Testes unitários
        run: npx vitest run --coverage

      - name: Instalar o Chromium do Playwright
        run: npx playwright install chromium --with-deps

      # A extensão só carrega com o navegador em janela; o xvfb fornece a tela.
      - name: Testes E2E
        run: xvfb-run -a npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

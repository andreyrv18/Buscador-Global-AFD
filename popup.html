<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 350px; padding: 15px; }
        h3 { margin-top: 0; color: #0056b3; }
        .btn { display: block; width: 100%; padding: 10px; margin-top: 15px; background: #0056b3; color: white; text-align: center; border: none; border-radius: 4px; cursor: pointer; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <h3>Analisador de AFD</h3>
    <p>Selecione o arquivo .txt para análise:</p>
    
    <input type="file" id="arquivoAfd" accept=".txt">
    
    <div id="status">Aguardando arquivo...</div>
    
    <button id="btnDownload" class="btn" style="display: none;">Baixar Relatório JSON</button>

    <script src="popup.js"></script>
</body>
</html>

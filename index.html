<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Filtro AFD</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">
        <h2>Buscador Global para Arquivo Fonte de Dados (AFD)</h2>
        <p>Selecione o arquivo exportado do REP. Serão exibidos os registros de Inclusão, Alteração e Exclusão (Tipo 5).
        </p>
        <p>Portarias suportadas: 595, 1510, 671</p>
        <div class="file-upload-box">
            <input type="file" id="arquivoAfd" accept=".txt" class="hidden-input">
            <label for="arquivoAfd" class="btn btn-primary btn-icon">
                <span class="material-symbols-rounded">upload</span>
                Selecionar arquivo
            </label>
            <span id="fileNameDisplay" class="file-name-display">Nenhum arquivo selecionado</span>

        </div>

        <div id="status"></div>

        <!-- Esta área só aparece após a leitura do arquivo -->
        <div id="resumoAFD">
            <!-- Resumo da AFD via JS-->

        </div>
        <div id="sessaoResultados">


            <div class="header-resultados">

                <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                    <div>
                        <label for="filtroNome"
                            style="font-weight: bold; font-size: 12px; display: block;">Nome:</label>
                        <input type="text" id="filtroNome" placeholder="Buscar nome..."
                            style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; width: 140px;">
                    </div>
                    <div>
                        <label for="filtroCpf" style="font-weight: bold; font-size: 12px; display: block;">CPF /
                            PIS:</label>
                        <input type="text" id="filtroCpf" placeholder="Buscar CPF/PIS..."
                            style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; width: 130px;">
                    </div>
                    <div>
                        <label for="filtroData"
                            style="font-weight: bold; font-size: 12px; display: block;">Data:</label>
                        <input type="date" id="filtroData"
                            style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
                    </div>
                    <!-- NOVO: Select de Ordenação -->
                    <div>
                        <label for="ordemData" style="font-weight: bold; font-size: 12px; display: block;">Ordem
                            (Data):</label>
                        <select id="ordemData" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="asc" selected>Crescente</option>
                            <option value="desc">Decrescente</option>
                        </select>
                    </div>
                    <div>
                        <label for="tamanhoPagina" style="font-weight: bold; font-size: 12px; display: block;">Por
                            página:</label>
                        <select id="tamanhoPagina" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="500">500</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="resumoValores"
                style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap;"></div>
            <!-- Resumo inserido via JS -->
        </div>
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Hora</th>
                    <th>Operação</th>
                    <th>CPF / PIS</th> <!-- Alterado aqui -->
                    <th>Colaborador (Nome)</th> <!-- Alterado aqui -->
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                <!-- Linhas inseridas via JS -->
            </tbody>
        </table>
        <div class="paginacao" id="controlesPaginacao" style="display: none;">
            <button id="btnAnterior" class="btn-primary">Anterior</button>
            <span id="infoPagina" style="font-size: 16px; font-weight: bold; color: #004085;">Página 1 de 1</span>
            <button id="btnProximo" class="btn-primary">Proxima </button>
        </div>
        <div>
            <button id="btnDownload" class="btn" type="button">⬇ Baixar JSON</button>
        </div>
    </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
